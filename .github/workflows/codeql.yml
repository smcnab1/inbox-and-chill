name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            runner: macos-26
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install native tools before CodeQL starts its Rosetta build tracer.
      - name: Prepare Swift build
        if: matrix.language == 'swift'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodegen generate
          # Swift build tracing requires Xcode 26 on macOS 26.
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Mac app for analysis
        if: matrix.language == 'swift'
        run: |
          xcodebuild -project InboxAndChill.xcodeproj -scheme InboxAndChill \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO build

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
